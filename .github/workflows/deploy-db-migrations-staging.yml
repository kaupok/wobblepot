name: Deploy DB migrations [staging]

on:
  push:
    branches: [main]
  # Manual trigger lets us re-seed staging on demand without pushing a no-op
  # change to a seed file (HON-529). The seed step always runs on dispatch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel running migrations - let them queue

permissions:
  contents: read
  actions: write # so pnpm cache works

jobs:
  migrate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Skip the seed step when nothing under prisma/seed*.ts or
      # prisma/schema.prisma changed in this push. Re-seeding identical data
      # was ~16% of monthly Actions minutes (HON-529). On workflow_dispatch
      # we skip detection and always run the seed (handled by the seed step's
      # `if:` below) — paths-filter has no base ref on manual triggers.
      - name: Detect seed-source changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            seed:
              - 'prisma/seed*.ts'
              - 'prisma/schema.prisma'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://localhost:5432/placeholder
          DATABASE_URL_UNPOOLED: postgresql://localhost:5432/placeholder
        run: pnpm prisma generate

      # Database secrets are scoped to migration steps only (not install/generate steps)
      # to prevent exposure to postinstall scripts and minimize credential leakage risk
      - name: Check migration status [staging]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_STAGING }}
        # || true makes this step informational only - shows pending migrations but never fails
        run: pnpm prisma migrate status || true

      - name: Deploy migrations [staging]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_STAGING }}
        run: pnpm prisma migrate deploy

      - name: Seed database [staging]
        if: steps.filter.outputs.seed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_STAGING }}
          # Plant the E2E fixture accounts (HON-560) — staging-smoke's
          # pattern-(b) specs sign in with these instead of creating fresh
          # accounts via /api/e2e-seed (which staging 404s by design).
          # Without SEED_TEST_USERS=1 the seedTestUsers() branch silently
          # no-ops and the fixture users never exist on staging.
          SEED_TEST_USERS: '1'
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          FORGOT_PASSWORD_TEST_EMAIL: ${{ secrets.FORGOT_PASSWORD_TEST_EMAIL }}
          FORGOT_PASSWORD_TEST_PASSWORD: ${{ secrets.FORGOT_PASSWORD_TEST_PASSWORD }}
        run: pnpm db:seed
