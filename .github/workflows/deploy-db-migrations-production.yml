# Production Database Migration Workflow
#
# `deploy-production.yml` calls this as its `migrate` job, with the commit its
# `pick` job chose (HON-1507), so migrations and code always ship from the same
# commit and code never ships when migrations fail. That is the normal path:
# run "Deploy production" and nothing else.
#
# Dispatch this workflow on its own only for a migration-only run, such as a
# step of docs/RUNBOOKS/database-recovery.md. A dispatch has no `sha` input, so
# it checks out `main` HEAD.
#
# Note: Automatic production deployments are disabled via Vercel's Ignored Build Step
# to prevent code from deploying before migrations complete.

name: Deploy DB migrations [production]

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to migrate from. Empty checks out the default ref.
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  actions: write # so pnpm cache works

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The commit `deploy-production.yml` picked. On a direct dispatch
          # `inputs.sha` is empty and checkout falls back to the default ref.
          ref: ${{ inputs.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://localhost:5432/placeholder
          DATABASE_URL_UNPOOLED: postgresql://localhost:5432/placeholder
        run: pnpm prisma generate

      # Database secrets are scoped to migration steps only (not install/generate steps)
      # to prevent exposure to postinstall scripts and minimize credential leakage risk
      - name: Check migration status [production]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
        # || true makes this step informational only - shows pending migrations but never fails
        run: pnpm prisma migrate status || true

      - name: Deploy migrations [production]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
        run: pnpm prisma migrate deploy

      - name: Seed database [production]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
        run: pnpm db:seed

      # Steps for the signed-out home page's demo (docs/DEPLOYMENT.md →
      # "Library preparation steps"). Idempotent: it writes only rows that are
      # missing or stale, so most runs find nothing and cost nothing. It never
      # blocks the deploy: the page falls back to its static example day for
      # any meal without steps. `--limit` caps one run at about $0.60 should a
      # change ever stale every row at once, and `timeout-minutes` keeps a slow
      # provider inside the job's 15-minute limit, which `continue-on-error`
      # would not survive. Rows written before a cut-off stay.
      - name: Write library preparation steps [production]
        if: success()
        continue-on-error: true
        timeout-minutes: 8
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
        run: pnpm steps:library --confirm --limit=30

      - name: Production deployment checklist
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Production Migrations Complete

          ### Next Steps:

          1. **Verify migrations succeeded** - Check logs above for any errors

          2. **Deploy code to production**:
             - Called from "Deploy production": its `deploy` job runs next, from the same commit
             - Dispatched on its own: run [Deploy production](../../actions/workflows/deploy-production.yml) to ship code

          3. **Monitor production**:
             - Check production site is working
             - Monitor logs for errors
             - Be ready to rollback if needed

          EOF
