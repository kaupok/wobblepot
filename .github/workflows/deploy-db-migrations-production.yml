name: Deploy DB migrations [production]

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # so pnpm cache works

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Check migration status [production]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
        run: pnpm prisma migrate status || true

      - name: Deploy migrations [production]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
        run: pnpm prisma migrate deploy
