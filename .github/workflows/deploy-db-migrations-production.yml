# Production Database Migration Workflow
#
# IMPORTANT: This workflow must be run BEFORE deploying code to production.
#
# Production Deployment Process:
# 1. Merge changes to main (staging auto-deploys)
# 2. Test in staging environment
# 3. Run this workflow to deploy production migrations
# 4. After migrations succeed, run "Deploy code [production]" workflow:
#    - Actions → Deploy code [production] → Run workflow
# 5. Verify production deployment
#
# Note: Automatic production deployments are disabled via Vercel's Ignored Build Step
# to prevent code from deploying before migrations complete.

name: Deploy DB migrations [production]

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write # so pnpm cache works

jobs:
  migrate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://localhost:5432/placeholder
          DATABASE_URL_UNPOOLED: postgresql://localhost:5432/placeholder
        run: pnpm prisma generate

      # Database secrets are scoped to migration steps only (not install/generate steps)
      # to prevent exposure to postinstall scripts and minimize credential leakage risk
      - name: Check migration status [production]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
        # || true makes this step informational only - shows pending migrations but never fails
        run: pnpm prisma migrate status || true

      - name: Deploy migrations [production]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
        run: pnpm prisma migrate deploy

      - name: Seed database [production]
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PRODUCTION }}
        run: pnpm db:seed

      - name: Production deployment checklist
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Production Migrations Complete

          ### Next Steps:

          1. **Verify migrations succeeded** - Check logs above for any errors

          2. **Deploy code to production**:
             - Go to [GitHub Actions](../../actions/workflows/deploy-code-production.yml)
             - Click "Run workflow" button
             - Wait for deployment to complete
             - Check workflow summary for deployment URL

          3. **Monitor production**:
             - Check production site is working
             - Monitor logs for errors
             - Be ready to rollback if needed

          **⚠️ Important**: Do not deploy code before migrations succeed!
          EOF
