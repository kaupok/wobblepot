name: Preview smoke

# Tier 2 of the HON-455 E2E setup. Fires when Vercel reports a successful
# preview deploy and runs the @smoke-tagged Playwright specs against the
# real preview URL (backed by a per-PR Neon branch via maybe-migrate.sh).
# Status shows up on the PR conversation and blocks merge on failure.

on:
  deployment_status:

concurrency:
  # Per-ref so a newer push cancels in-flight smoke runs for the same
  # branch — otherwise every preview deploy on a fast-iterating PR piles
  # up its own 15+ min smoke job.
  group: preview-smoke-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests on Vercel preview
    runs-on: ubuntu-latest
    # Bumped above the Playwright worst-case (5 tests × retries × per-test
    # timeout) so we see real failures + traces, not a GitHub-level cancel.
    timeout-minutes: 25
    # Only run when a Vercel preview deploy completes successfully.
    # `github.event.deployment.environment` is "Preview" for Vercel previews.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview' &&
      github.event.deployment_status.environment_url != ''
    permissions:
      contents: read
      statuses: write

    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      FORGOT_PASSWORD_TEST_EMAIL: ${{ secrets.FORGOT_PASSWORD_TEST_EMAIL }}
      FORGOT_PASSWORD_TEST_PASSWORD: ${{ secrets.FORGOT_PASSWORD_TEST_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code at deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run @smoke specs against preview URL
        run: pnpm test:e2e --grep=@smoke

      # `always()` instead of `failure()` so we also keep the report when a
      # test run is cancelled (e.g. a superseding push triggers
      # concurrency-cancel). `continue-on-error` keeps missing artifacts
      # from flipping an otherwise-green job red.
      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-preview-${{ github.event.deployment.sha }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
