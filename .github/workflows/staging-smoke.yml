name: Staging smoke

# Tier 3 of the HON-455 E2E setup. Runs after the staging DB-migration
# workflow succeeds on main. Staging is auto-deployed by Vercel on push to
# main, so we poll the staging URL until it responds before running the
# @smoke-tagged specs. Failure blocks production promotion (see
# docs/DEPLOYMENT.md → "E2E testing tiers").

on:
  workflow_run:
    # The workflows filter is a glob pattern, so unescaped [staging] is a
    # character class matching a single character — it can never match the
    # literal "[staging]" in the workflow name. Escape the brackets or this
    # trigger silently never fires (bug: workflow had 0 runs Apr 22–Jun 6).
    workflows: ['Deploy DB migrations \[staging\]']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke tests on staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    env:
      # STAGING_URL is a repository variable so it can be updated without code
      # changes. Falls back to the production staging domain when unset.
      PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL || 'https://wobblepot.dev' }}
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      FORGOT_PASSWORD_TEST_EMAIL: ${{ secrets.FORGOT_PASSWORD_TEST_EMAIL }}
      FORGOT_PASSWORD_TEST_PASSWORD: ${{ secrets.FORGOT_PASSWORD_TEST_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so the wait step below can ask whether the SHA staging
          # is serving is a *descendant* of the one we're waiting for.
          fetch-depth: 0

      # Fail fast (HON-560) before any install work if a @smoke spec slipped
      # in that depends on /api/e2e-seed — staging 404s that route by design,
      # so such a spec can never pass here regardless of app health.
      - name: Check @smoke specs are staging-safe
        run: bash scripts/check-smoke-specs.sh

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the ~150 MB Chromium download across runs (HON-529).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Vercel auto-deploys staging on main, but the deploy may still be in
      # flight when this workflow starts — or worse, the *previous* build
      # is still what's serving. Poll /api/status until its `commitSha`
      # field reports the commit that triggered the upstream workflow, or a
      # descendant of it, so we only run smoke tests against a build that
      # includes the migrations this run was scheduled for.
      #
      # Accepting descendants matters: pushes to main often land minutes
      # apart, and this workflow's `concurrency` group serialises runs. By
      # the time a queued run starts polling, staging can already be serving
      # a *newer* commit — an exact-SHA match can then never succeed and the
      # step burns its whole budget before failing. Two runs failed this way
      # on 2026-08-27.
      - name: Wait for staging deploy to serve ${{ github.event.workflow_run.head_sha || github.sha }}
        env:
          # `workflow_run.head_sha` for the upstream migration workflow,
          # `github.sha` for manual `workflow_dispatch` triggers.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -eu
          url="${PLAYWRIGHT_BASE_URL%/}/api/status"
          attempts=60
          interval=10
          echo "Waiting for $url to report commitSha=$EXPECTED_SHA (or a descendant)"
          for attempt in $(seq 1 "$attempts"); do
            body=$(curl -sf --max-time 5 "$url" || true)
            actual_sha=$(echo "$body" | jq -r '.commitSha // empty' 2>/dev/null || true)
            if [ -n "$actual_sha" ]; then
              if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
                echo "staging is live on $EXPECTED_SHA"
                exit 0
              fi
              # `fetch-depth: 0` snapshots history at job start, so a push to
              # main *during* the poll leaves us serving a SHA we've never
              # heard of. Fetch once on first sight of an unknown commit
              # rather than burning the remaining budget on it.
              if ! git cat-file -e "$actual_sha^{commit}" 2>/dev/null; then
                echo "  $actual_sha is not in local history — fetching origin/main"
                git fetch --quiet origin main 2>/dev/null || true
              fi
              # `--is-ancestor` needs both commits locally; a force-push or a
              # still-unknown SHA makes it error, which must not abort the loop.
              if git merge-base --is-ancestor "$EXPECTED_SHA" "$actual_sha" 2>/dev/null; then
                echo "staging is live on $actual_sha, a descendant of $EXPECTED_SHA — good enough"
                exit 0
              fi
            fi
            echo "attempt $attempt/$attempts: staging commitSha=${actual_sha:-unknown}, waiting for $EXPECTED_SHA"
            sleep "$interval"
          done
          echo "staging never reported commitSha=$EXPECTED_SHA (or a descendant) after $((attempts * interval / 60)) minutes" >&2
          exit 1

      - name: Run @smoke specs against staging
        run: pnpm test:e2e --grep=@smoke

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-staging-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
