name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ## Review Guidelines

            Balance feedback between identifying issues AND suggesting substantive improvements:

            **Always flag:**
            - Bugs and logic errors
            - Security or critical performance issues
            - Missing tests or incomplete implementations
            - Convention/pattern violations in the repo

            **Suggest improvements ONLY if:**
            - The change significantly improves maintainability, readability, or design
            - The suggestion addresses a real problem, not just preference
            - The benefit clearly outweighs the effort
            - Skip trivial refactors or minor style tweaks

            **Avoid suggesting:**
            - Micro-optimizations or over-engineering
            - Rewrites of working code for aesthetic reasons
            - "Nice-to-have" improvements with minimal impact
            - Alternative patterns without clear justification

            ## Review Style

            - Be concise and direct
            - Explain the "why" behind suggestions, not just the "what"
            - Only comment if there's clear value to the reviewer or codebase
            - When suggesting improvements, briefly justify the benefit

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

