name: CI

# Runs on every PR and every push to `main`, docs-only changes included.
# `Lint, Type Check & Test` (the `ci` job below) is a required status check on
# `main` (HON-584), and a required check has to come from a workflow that
# cannot be skipped: when a path filter skips the workflow, the check stays
# "Pending" and blocks the merge for good (GitHub docs → "Troubleshooting
# required status checks": avoid requiring workflows that can be skipped).
# That is why the docs-only `paths-ignore` from HON-529 is gone. The
# alternative, a second workflow with the same check name that exits 0 on
# docs paths, was rejected: a PR that changes docs and code triggers both,
# and two check runs of one name race for the verdict. The repository is
# public, so Actions minutes are free; a docs-only run costs about 4 min of
# wall time and nothing else.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One copy for every job (HON-1183): a job that imports src/lib/env.ts needs
# the variables its schema parses. Step-level `env` entries override these, and
# `env-audit` blanks the secrets it does not need.
env:
  # Literal brand string, not a secret: only required so `clientEnv`
  # (src/lib/env.ts) parses. The value is rendered in emails only, which
  # no CI job sends. Kept out of repo variables so nothing drifts from
  # the product name.
  NEXT_PUBLIC_APP_NAME: Wobblepot
  NEXT_PUBLIC_APP_ENV: ci
  NEXT_TELEMETRY_DISABLED: 1
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honkadori_test?sslmode=disable
  DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/honkadori_test?sslmode=disable
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_CI }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL_CI }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN_CI }}
  # Not a secret: both sides of the bearer check live inside the E2E job.
  # The account-deletion E2E spec (HON-479) calls the real purge cron with
  # it instead of adding a test-only branch to the production route. 32+
  # chars to satisfy the env schema.
  CRON_SECRET: ci-e2e-cron-secret-not-a-real-credential
  SEED_TEST_USERS: '1'
  SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
  SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
  FORGOT_PASSWORD_TEST_EMAIL: ${{ secrets.FORGOT_PASSWORD_TEST_EMAIL }}
  FORGOT_PASSWORD_TEST_PASSWORD: ${{ secrets.FORGOT_PASSWORD_TEST_PASSWORD }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks run as four parallel jobs (HON-1177): one sequential job took
  # about 16 min per green run, and every PR, the `/merge` poll and the
  # orchestrator wait on it. The repository is public, so Actions minutes are
  # free and wall time is the only cost. The fifth job, `ci`, keeps the old
  # check name `Lint, Type Check & Test` and turns red when any of the four
  # does — see its own comment.
  #
  # Each job carries a full copy of the same `permissions` block. The `env`
  # block is shared at workflow level, above.

  # ==========================================
  # Static checks: git, lockfile and source-tree scans; no DB or browser
  # ==========================================
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so `git merge-base` resolves for the immutability
          # guards below — the PR base sha is an ancestor that only a full
          # clone is guaranteed to contain, and the push-side `--tree` check
          # walks all of `main`'s first-parent history. At 9 MiB / ~720 commits
          # that costs a couple of seconds. Reverting to the depth-1 default
          # does not merely degrade the guards, it disables them: the base sha
          # is never fetched, so the PR check exits 2 on an unresolvable ref,
          # and `--tree` exits 2 on the shallow clone — reddening every `main`
          # run. Fetching the base back at `--depth=1` is worse still — it
          # resolves the ref but re-shallows the repository, and the guard then
          # falls back to a two-tree diff that blames the branch for every
          # migration the base gained since the fork point. If this has to
          # change, fetch without `--depth`. The other jobs read no history and
          # keep the depth-1 default.
          fetch-depth: 0

      # Guardrail (HON-641): a migration that is already on `main` has been
      # applied somewhere durable — deploy-db-migrations-staging.yml runs
      # `prisma migrate deploy` on every merge, and production applies the same
      # files. Editing one afterwards can only break the checksum Prisma
      # recorded at apply time, which is what made `migrate dev` unusable in
      # HON-558. Needs nothing but git, so it runs before the install and fails
      # in seconds.
      #
      # Two steps, one per event. This one is prevention: it runs on the PR,
      # before the migration reaches `main`. The next is detection for the
      # edits that get past it anyway.
      - name: Check migrations are immutable
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-migrations-immutable.sh "$BASE_SHA"

      # Detection, not prevention (HON-649, HON-671). `Lint, Type Check & Test`
      # is a required status check on `main` (HON-584), but `enforce_admins` is
      # off, so an edited migration can still land through an admin's
      # `gh pr merge --admin`. By the time this runs, deploy-db-migrations-
      # staging.yml has been triggered by the same push, so the best available
      # outcome is a loud signal — and the decision is to fail CI on `main`
      # (this job, and through it the `Lint, Type Check & Test` aggregate),
      # the loudest signal the repo has, rather than add a notification path.
      #
      # A red CI on `main` blocks nothing downstream (verified against the
      # triggers): deploy-storybook.yml runs on its own `push` paths filter,
      # deploy-production.yml and deploy-db-migrations-production.yml are
      # `workflow_dispatch` only (the second also `workflow_call`), and
      # staging-smoke.yml follows the staging migrations workflow — none uses
      # `workflow_run` or `needs` on this one.
      #
      # `--tree` checks HEAD's state, not this push's range: every migration.sql
      # must match the blob it was first added with on `main`'s first-parent
      # history, and none may be deleted. So the red is durable — every later
      # push stays red until the edit is reverted, and an unrelated merge can
      # no longer turn `main` green over the drift. It needs the full history
      # the checkout above provides, and exits 2 on a shallow clone rather than
      # passing. The two historical edits to migrations that had failed to apply
      # (#181, #356) are pinned in scripts/migration-immutability-allowlist.txt;
      # a pin accepts one exact blob, with a reason, and is the only sanctioned
      # way to keep a post-add edit. It assumes each first-parent commit is one
      # merge unit; the repo allows only squash merges. A direct multi-commit
      # push that adds a migration and fixes it up in a later commit reads as
      # an edit, and the remedy there is a pin, not a revert — see the script
      # header.
      #
      # Because it checks the tree, the workflow-level `cancel-in-progress` no
      # longer hides an edit: a push whose run is cancelled by the next push is
      # still in the next run's HEAD. The cost of this step running first is
      # unchanged — while it is red, each `main` run also skips the rest of
      # this job (lint, format, type check and the other static scans; the
      # unit, Storybook and E2E jobs still run) — which is one more reason to
      # revert promptly.
      #
      # Recovery is a revert, not a fix-forward. `migrate deploy` never
      # re-applies a migration it has recorded, so staging and production still
      # hold the checksum of the ORIGINAL SQL; only restoring those bytes clears
      # the drift, and a new migration would leave it in place for good. The
      # script prints that instruction itself in this mode. The revert PR's own
      # range check still fails (a revert is an `M` against its base), and the
      # required check with it, so a human merges it from a terminal with
      # `gh pr merge --admin` and says why in the PR; its `main` push then goes
      # green here.
      - name: Check migrations are immutable (post-merge detection)
        if: github.event_name == 'push'
        run: bash scripts/check-migrations-immutable.sh --tree

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint, Prettier and tsc caches (HON-1181). Cold, the three steps took
      # about 100 s per run; warm, they re-check only the files that changed.
      #
      # Every key ends in the commit SHA. `actions/cache` does not save on an
      # exact key hit, so a fixed key would be written once and then drift
      # further from `main` on every merge. The SHA saves a fresh cache on
      # every run, and the restore-keys prefix picks the newest one.
      #
      # The ESLint and Prettier caches use `--cache-strategy content`: the
      # default `metadata` strategy compares mtimes, and a fresh checkout gives
      # every file a new mtime, so the cache would never hit. The flags live in
      # these steps only, so `pnpm lint` and `pnpm format:check` write no cache
      # files locally.
      #
      # ESLint's cache tracks each linted file and the config, but not files a
      # plugin reads on its own. @shadcn/lint reads components.json,
      # tsconfig.json, the CSS files under src and the primitives under
      # src/components/ui, so they are in the key: a token change must re-lint
      # every file, and the restore never falls back past that hash.
      #
      # `shadcn/no-restyle` also follows imports into any component file to
      # see whether it forwards `className` to a primitive. No key short of
      # all of src covers that, and that key would almost never hit. So a PR
      # can keep a cached pass for a file whose imported component changed,
      # and the push to `main` re-lints every file: it drops the restored
      # cache, so a violation turns `main` red on the merge that caused it,
      # not on a later PR. That run also saves a complete cache for the PRs.
      - name: Cache ESLint results
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'components.json', 'tsconfig.json', 'src/**/*.css', 'src/components/ui/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'components.json', 'tsconfig.json', 'src/**/*.css', 'src/components/ui/**') }}-

      - name: Run linter
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then rm -f .eslintcache; fi
          pnpm exec eslint . --cache --cache-location .eslintcache --cache-strategy content

      # The lockfile pins Prettier and prettier-plugin-tailwindcss.
      - name: Cache Prettier results
        uses: actions/cache@v6
        with:
          path: .prettiercache
          key: ${{ runner.os }}-prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-prettier-${{ hashFiles('pnpm-lock.yaml', '.prettierrc', '.prettierignore') }}-

      - name: Check formatting
        run: pnpm exec prettier --check . --cache --cache-location .prettiercache --cache-strategy content

      # `incremental: true` in tsconfig.json writes tsconfig.tsbuildinfo. tsc
      # checks it against each file's content hash and its own version, so a
      # cache from an older lockfile or tsconfig is safe, and the last
      # restore-key falls back to it.
      - name: Cache TypeScript build info
        uses: actions/cache@v6
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}-
            ${{ runner.os }}-tsc-

      - name: Run type check
        run: pnpm type-check

      # Dependency advisory gate, half 1 of 2 (HON-595).
      #
      # HON-588 cleared defu@6.1.4 (high — prototype pollution on the
      # better-auth > defu production auth path) purely by lockfile dedupe onto
      # 6.1.7. No spec changed: better-auth@1.7.2 still declares `^6.1.4`, so a
      # lockfile regeneration can silently put the advisory back, and `pnpm
      # audit` would not notice at any threshold we can afford to gate on (see
      # the second half at the end of this job). This asserts those specific
      # resolutions directly. The pin list, with an advisory range and a reason
      # per entry, lives in scripts/check-lockfile-pins.ts.
      #
      # Runs here, in the cheap static job, because it is a local text scan of
      # pnpm-lock.yaml — no network, no DB, no browser, so it cannot flake and
      # costs ~2s.
      - name: Check lockfile pins
        run: pnpm lockfile:check

      # Persistence boundary gate (HON-1185): a file outside src/lib that
      # imports @/lib/prisma fails unless it is in the shrink-only
      # scripts/prisma-import-allowlist.txt. A local tree scan — no network, no
      # DB — so it sits in the cheap static job.
      - name: Check Prisma import boundary
        run: pnpm prisma-boundary:check

      # File size ratchet (HON-1241): a code file over 5,000 tokens (bytes / 4)
      # fails unless it is in the shrink-only scripts/file-size-allowlist.txt,
      # and a listed file fails more than 5% over its cap. Husky runs it on
      # staged files, but `--no-verify` and headless workers skip Husky, so CI
      # scans the whole tree. A local scan, so it sits in the cheap static job.
      - name: Check file size
        run: pnpm file-size:check

      # The step above reads the caps from the PR's own allowlist, so it cannot
      # see a PR that raises a cap or lists a new file. This compares the
      # allowlist with the base, and accepts a new entry only as a git rename of
      # a listed file at no higher a cap. PR-only, like the migration check.
      - name: Check the file size allowlist only shrank
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm file-size:check --base "$BASE_SHA"

      # Coverage ratchet (HON-1192): the unit job fails a run under the
      # thresholds in vitest.config.ts, but it reads the PR's own thresholds,
      # so it cannot see a PR that lowers one. This compares them with the
      # base. A lowered one passes only with a `Coverage threshold lowered:
      # <why>` line in the PR body. The body comes from the event payload, so a
      # re-run after a body edit still reads the old body; push again instead.
      # PR-only, like the migration check: on `main` the PR already passed it.
      - name: Check coverage thresholds were not lowered
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: pnpm coverage:ratchet "$BASE_SHA"

      # Colocated story gate (HON-757): every component under src/components
      # needs a sibling `.stories.tsx`, or an allowlist entry with a reason in
      # scripts/check-colocated-stories.ts. A local tree scan like the lockfile
      # check above — no network, so it sits in the cheap static job.
      - name: Check colocated stories
        run: pnpm stories:check

      # Seed-data gate (HON-551): static validation of the seed TS arrays —
      # cross-file duplicates, naming conventions, nutritional plausibility,
      # and et translation coverage. No DB needed, so it runs in the cheap
      # static job rather than beside the seed in the E2E job.
      - name: Validate seed data
        run: pnpm db:validate

      # Guardrail (HON-560): @smoke specs run against shared staging, where
      # /api/e2e-seed 404s by design — fail at PR time if one reaches for a
      # seed-dependent helper. Static grep, no DB or browser needed.
      - name: Check @smoke specs are staging-safe
        run: bash scripts/check-smoke-specs.sh

      # ==========================================
      # Dependency advisory gate, half 2 of 2 (HON-595)
      # ==========================================
      # Threshold: critical only. This is a deliberate, settled choice — do not
      # re-litigate it in review without new numbers.
      #
      # `pnpm audit` bare reports 33 high / 21 moderate / 4 low on main
      # (2026-09-07). Every one of those is transitive and dev/build-time, with
      # no fix available short of a dependency major, so gating on `high` would
      # turn every PR red on day one and the gate would be disabled within a
      # week. `critical` has 0 advisories today, so this step starts green and
      # stays honest: a new critical is a real, actionable regression.
      #
      # The option not taken is a full `pnpm audit` plus an allowlist file. That
      # is the right end state, but an allowlist with 33 entries on day one is a
      # rubber stamp, so it is deferred until the transitive high count is low
      # enough to review entry by entry.
      #
      # Placed last, and deliberately NOT next to `Check lockfile pins` above:
      # this is the only step in the workflow that talks to the npm registry,
      # and `pnpm audit` exits 1 on a transport failure exactly as it does on a
      # finding (~70s of retries first). Earlier in the job a registry blip
      # would red the job before the lockfile pins, the colocated stories, the
      # seed validation and the smoke-spec check ever reported, costing the PR
      # those signals for a reason unrelated to its diff. Here it can only ever
      # be the last thing to fail. The unit, Storybook and E2E jobs run in
      # parallel and report regardless.
      #
      # `!cancelled()` rather than the default: an earlier failing step should
      # not hide a newly published critical, and a manual job cancel should not
      # spend 70s on retries.
      - name: Audit dependencies (critical)
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level critical

  # ==========================================
  # Unit tests (Vitest), in three shards, with the coverage gate (HON-1192)
  # ==========================================
  # The `unit`, `unit-node` and `unit-db` projects, split by file into three
  # shards that run in parallel (HON-1203, HON-1408): one run was the slowest
  # CI job. Each shard writes a blob report with its coverage, and
  # `unit-report` merges them, so the thresholds in vitest.config.ts apply to
  # the whole suite. A shard covers about a third of the files, so it sets
  # `COVERAGE_SHARD`, which turns the thresholds off for that run. Still no
  # database service (HON-1183): `unit-db` runs `*.db.test.ts` against
  # PGlite, an in-process Postgres (HON-1186), and points its own
  # `DATABASE_URL` at a closed port.
  unit:
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    strategy:
      # Run every shard to the end, so one red run shows every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `default` prints the failures in this log; `blob` writes
      # `.vitest/blob/blob-<shard>-3.json` for the merge. Coverage goes into
      # the blob, so `json` is the only coverage reporter a shard needs.
      - name: Run unit tests with coverage (shard ${{ matrix.shard }}/3)
        env:
          COVERAGE_SHARD: '1'
        run: >-
          pnpm test:coverage --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=blob --coverage.reporter=json

      # `.vitest/` is a hidden directory, which upload-artifact skips by
      # default.
      - name: Upload blob report
        uses: actions/upload-artifact@v7
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # Unit tests: merge the shards and apply the coverage gate (HON-1203)
  # ==========================================
  # Merges the three blob reports and checks the merged coverage against the
  # thresholds in vitest.config.ts, so a merged run under any of them fails
  # this job. No `if: always()`: when a shard fails this job is skipped, and
  # `ci` fails on the shard result. It runs no tests, but it loads the
  # config, so it still needs the install.
  unit-report:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: unit-blob-*
          merge-multiple: true
          path: .vitest/blob/

      # `text-summary`: the config's `text` reporter prints a row per file.
      - name: Merge reports and check coverage thresholds
        run: pnpm exec vitest --merge-reports --coverage --coverage.reporter=text-summary

  # ==========================================
  # Storybook: a11y gate and static build
  # ==========================================
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the ~150 MB Chromium download across runs. Playwright is pinned
      # in pnpm-lock.yaml, so the lockfile hash is a stable cache key (HON-529).
      # The E2E job restores the same key.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # A cache hit skips `--with-deps` too, and no `install-deps` step runs
      # (HON-1181): the ubuntu runner image ships Google Chrome, so the
      # shared libraries Chromium needs are already installed.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook a11y tests
        run: pnpm test-storybook:ci

      # Static build gate for the GitHub Pages deploy (deploy-storybook.yml).
      # The a11y run above exercises the stories under Vitest but never runs
      # `storybook build`, so a broken manager bundle or preview head would
      # otherwise surface only as a failed deploy on main after merge.
      # NODE_ENV must be `production` to match deploy-storybook.yml: `vite build`
      # only defaults it when unset, so the workflow-level `NODE_ENV: test` would
      # otherwise flip isProduction, the dev/prod export condition, and the
      # inlined process.env.NODE_ENV — gating a different artifact than the one
      # that ships. Scoped to this step: on the job or the workflow it would make
      # `pnpm install` skip devDependencies.
      - name: Build Storybook
        env:
          NODE_ENV: production
        run: pnpm build-storybook

  # ==========================================
  # E2E tier 1: Playwright against Docker Postgres sidecar (HON-455)
  # ==========================================
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Above 29 Playwright tests × retries × 60s per-test timeout plus all
    # the setup steps so a slow run surfaces real failures instead of a
    # GitHub-level job cancel.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write

    # Postgres sidecar powers the E2E tier 1 (HON-455). Migrations + seed run
    # against this DB before Playwright. Doesn't catch Neon-specific quirks
    # (pooling, cold starts) — staging-smoke covers those.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: honkadori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the ~150 MB Chromium download across runs. Playwright is pinned
      # in pnpm-lock.yaml, so the lockfile hash is a stable cache key (HON-529).
      # The Storybook job restores the same key.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # A cache hit skips `--with-deps` too, and no `install-deps` step runs
      # (HON-1181): the ubuntu runner image ships Google Chrome, so the
      # shared libraries Chromium needs are already installed.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      # The E2E web server runs `next build` (playwright.config.ts). Cache its
      # `.next/cache` (HON-1181): the key moves with any change under src, and
      # the restore-keys prefix still gives a partial hit from the newest
      # build on the same lockfile. Measured from step start to the first
      # test: 46 s cold, 16 s on a hit.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # `.next/cache/fetch-cache` holds `unstable_cache` results that
      # `next start` wrote during the previous run's tests, such as the
      # sample meal plans (loadSampleWeek). Its key does not include the
      # database, so a PR that changes only the seed would be served the last
      # run's data. The post-job save runs after the tests, so drop the folder
      # on every restore rather than trying to exclude it from the save.
      - name: Drop restored Next.js data cache
        run: rm -rf .next/cache/fetch-cache

      # Tier 1 E2E run. Step-level timeout sits below the job-level 45m so
      # Playwright gets killed before the whole job, letting the artifact
      # upload below still run with the partial test-results/ directory.
      #
      # E2E_DISABLE_RATE_LIMIT is scoped to this step only. The unit tests now
      # run in their own job, but the rate-limit unit tests assume the real
      # limiter path, so the bypass must never reach the workflow-level `env`,
      # which the unit job reads too. It is only meaningful during the live
      # Playwright run against the built Next app.
      #
      # 2 workers (HON-1182): the `isolated` and `shared-fixture` projects run
      # in this one invocation, so `next build` runs once. The
      # `shared-fixture` project caps itself at 1 worker — see
      # tests/e2e/README.md → "Parallel groups in CI".
      - name: Run E2E tests (excluding @ai)
        timeout-minutes: 35
        env:
          E2E_DISABLE_RATE_LIMIT: '1'
        run: pnpm test:e2e --grep-invert=@ai

      - name: Upload Playwright artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-debug
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================
  # Aggregate check: Lint, Type Check & Test (HON-1177)
  # ==========================================
  # Keeps the check name the merge tooling waits for. The settle polls in
  # /merge (.claude/skills/merge/SKILL.md) and /auto-implement
  # (.claude/skills/auto-implement/SKILL.md) refuse to settle a code PR until
  # a check named `Lint, Type Check & Test` has registered, and
  # scripts/ci-settle-gate.test.ts pins that name (`CI_JOB`). Rename this job
  # and `/merge` never settles a code PR.
  #
  # `if: always()` so it still runs, and reports red, when a needed job fails
  # or is cancelled — without it a failed dependency would skip this job, and
  # a skipped check reads as passing. Any result other than `success`
  # (`failure`, `cancelled`, `skipped`) fails it.
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, unit, unit-report, storybook, e2e]
    if: always()
    permissions: {}

    steps:
      - name: Check the result of every job
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          UNIT_REPORT_RESULT: ${{ needs.unit-report.result }}
          STORYBOOK_RESULT: ${{ needs.storybook.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          status=0
          for pair in \
            "Static checks=$STATIC_RESULT" \
            "Unit tests (shards)=$UNIT_RESULT" \
            "Unit tests (merge)=$UNIT_REPORT_RESULT" \
            "Storybook=$STORYBOOK_RESULT" \
            "E2E=$E2E_RESULT"; do
            name=${pair%%=*}
            result=${pair#*=}
            echo "$name: $result"
            if [ "$result" != success ]; then
              echo "::error::$name finished with result '$result'"
              status=1
            fi
          done
          exit "$status"

  # ==========================================
  # Destructive migrations (HON-1512)
  # ==========================================
  # Flags, never fails. A migration that drops, deletes or rewrites data is
  # the one change a code rollback cannot undo, so the reviewer should see it:
  # when a migration this PR adds matches, the job summary lists the
  # statements and the PR gets the `destructive-migration` label. The
  # production deploy holds the same statements until it is dispatched with
  # `confirm_destructive` (deploy-production.yml → `destructive-check`).
  #
  # Its own job, not a `static` step, so only this job's token can write
  # labels. Not in the `ci` aggregate: a finding is information, not a
  # failure. The label steps carry `continue-on-error`, because a fork PR's
  # token is read-only and the summary already carries the list.
  destructive-migrations:
    name: Destructive migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history for the three-dot diff against the PR base, as in
          # `static`. A shallow clone has no merge base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the migrations this PR adds
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A plain assignment, not a process substitution, so `set -e` stops
          # the step when the diff fails: an empty list would read as clean.
          # `--no-renames`, as in check-migrations-immutable.sh: a re-added
          # migration under a new timestamp is otherwise a rename, not an add.
          added=$(git diff --no-renames --diff-filter=A --name-only "$BASE_SHA"...HEAD -- 'prisma/migrations/*/migration.sql')
          mapfile -t dirs < <(printf '%s\n' "$added" | sed '/^$/d' | xargs -r -n1 dirname)
          node scripts/check-destructive-migrations.ts "${dirs[@]}"

      - name: Add the destructive-migration label
        if: steps.check.outputs.found == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create destructive-migration --repo "$GITHUB_REPOSITORY" --force \
            --color B60205 --description "Adds a migration that drops, deletes or rewrites data" \
            || echo "::warning::Could not create the label; adding it creates a plain one."
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=destructive-migration' > /dev/null

      # A later push can remove the migration, and a stale label misleads the
      # reviewer. Only runs when the PR carries the label.
      - name: Remove a stale destructive-migration label
        if: steps.check.outputs.found != 'true' && contains(github.event.pull_request.labels.*.name, 'destructive-migration')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/destructive-migration" > /dev/null

  # ==========================================
  # Vercel env-var drift audit (HON-550)
  # ==========================================
  # Surfaces vars configured in Vercel that no code references any more —
  # the dead-config half of retiring a FEATURE_* gate, which has no other
  # review trigger. Independent of the `ci` job: read-only, needs no DB or
  # browser.
  #
  # Blocking. `--strict` makes the script exit 1 on an ORPHAN finding, which
  # fails the job. There is no `continue-on-error`, so a crash fails the job
  # too — a green check now proves the audit ran and found no drift. DOC-ONLY
  # findings stay non-blocking: the script exits 1 for ORPHAN only.
  env-audit:
    name: Vercel env-var drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # Forked PRs get no secrets, so the audit would fail on an empty token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Blank the secrets the workflow-level `env` carries. This job reads none
    # of them, and its `pnpm install` runs dependency install scripts that
    # could. The `ci` job needs no such block: it checks out nothing and runs
    # only its own shell step.
    env:
      BETTER_AUTH_SECRET: ''
      ANTHROPIC_API_KEY: ''
      UPSTASH_REDIS_REST_URL: ''
      UPSTASH_REDIS_REST_TOKEN: ''
      SMOKE_TEST_EMAIL: ''
      SMOKE_TEST_PASSWORD: ''
      FORGOT_PASSWORD_TEST_EMAIL: ''
      FORGOT_PASSWORD_TEST_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `.vercel/` is gitignored and absent in CI, so project identity comes
      # from secrets only — never from a checked-in project file.
      - name: Audit Vercel environment variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        # VERCEL_ORG_ID is gated alongside the other two: this project is
        # team-scoped, so without teamId the REST call 403s and the script
        # exits 1. Forked PRs get no secrets, so the guard below skips the
        # audit for them rather than failing the job on an empty token.
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::warning::Skipping env-var drift audit — VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_ORG_ID not configured. See docs/ENVIRONMENT_SETUP.md."
            exit 0
          fi
          # --strict: exit 1 on an ORPHAN finding. No `|| echo` fallback, so a
          # crash fails the job instead of passing silently.
          pnpm env:audit --strict
