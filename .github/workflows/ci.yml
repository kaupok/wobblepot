name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    # Above 29 Playwright tests × retries × 60s per-test timeout plus all
    # the setup steps so a slow run surfaces real failures instead of a
    # GitHub-level job cancel.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write

    # Postgres sidecar powers the E2E tier 1 (HON-455). Migrations + seed run
    # against this DB before Playwright. Doesn't catch Neon-specific quirks
    # (pooling, cold starts) — preview-smoke covers those.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: honkadori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honkadori_test?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/honkadori_test?sslmode=disable
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_CI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL_CI }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN_CI }}
      SEED_TEST_USERS: '1'
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      FORGOT_PASSWORD_TEST_EMAIL: ${{ secrets.FORGOT_PASSWORD_TEST_EMAIL }}
      FORGOT_PASSWORD_TEST_PASSWORD: ${{ secrets.FORGOT_PASSWORD_TEST_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run type check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook a11y tests
        run: pnpm test-storybook:ci

      # ==========================================
      # E2E tier 1: Playwright against Docker Postgres sidecar (HON-455)
      # ==========================================
      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      # Tier 1 runs every spec except Claude-calling ones (tagged @ai) —
      # AI-exercising flows are covered by preview-smoke once per PR and
      # staging-smoke once per merge. Running them on every push is the
      # dominant cost driver given this repo's PR velocity.
      #
      # Step-level `timeout-minutes` sits below the job timeout so when
      # Playwright hangs we fail the STEP (triggering `if: always()` on
      # the upload) rather than nuking the whole job.
      - name: Run E2E tests (excluding @ai)
        timeout-minutes: 35
        run: pnpm test:e2e --grep-invert=@ai

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
