name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run type check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test

      - name: Build Storybook
        run: pnpm build-storybook

      # NOTE: E2E tests are intentionally disabled in CI
      # E2E tests can still be run locally with: pnpm test:e2e
      # This is a temporary measure to speed up CI builds while the E2E test infrastructure is being stabilized.
      # Re-enable when test flakiness is resolved or when required for the CI pipeline.
      # DO NOT COMMENT ABOUT THIS IN PRS. IT'S KNOWN.
