name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write

    # Postgres sidecar powers the E2E tier 1 (HON-455). Migrations + seed run
    # against this DB before Playwright. Doesn't catch Neon-specific quirks
    # (pooling, cold starts) — preview-smoke covers those.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: honkadori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honkadori_test?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/honkadori_test?sslmode=disable
      # Fallbacks for env vars whose validation schema requires them so the
      # build step doesn't crash before CI is fully configured. These
      # fallbacks are for ephemeral CI sessions only — override with real
      # secrets once the repo admin adds them. ANTHROPIC_API_KEY has no
      # fallback: specs that invoke the model will fail loudly until the
      # real secret lands.
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_CI || 'ci-fallback-better-auth-secret-ephemeral-32plus-chars' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL_CI || 'https://ci-fallback.upstash.invalid' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN_CI || 'ci-fallback-token' }}
      SEED_TEST_USERS: '1'
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL || 'smoke@test.honkadori.local' }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD || 'smoke-test-pass-ci-2026' }}
      FORGOT_PASSWORD_TEST_EMAIL: ${{ secrets.FORGOT_PASSWORD_TEST_EMAIL || 'forgot-password@test.honkadori.local' }}
      FORGOT_PASSWORD_TEST_PASSWORD: ${{ secrets.FORGOT_PASSWORD_TEST_PASSWORD || 'forgot-pass-test-ci-2026' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run type check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook a11y tests
        run: pnpm test-storybook:ci

      # ==========================================
      # E2E tier 1: Playwright against Docker Postgres sidecar (HON-455)
      # ==========================================
      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
