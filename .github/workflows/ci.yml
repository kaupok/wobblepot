name: CI

# Skip CI for docs-only changes (HON-529). main has no required status
# checks today, so docs-only PRs simply show no CI status and remain
# mergeable. If CI ever becomes a required check, switch to the
# dummy-job pattern (a second workflow with the same `name:` that
# triggers on these paths and exits 0 immediately) so PRs don't hang.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    # Above 29 Playwright tests × retries × 60s per-test timeout plus all
    # the setup steps so a slow run surfaces real failures instead of a
    # GitHub-level job cancel.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write

    # Postgres sidecar powers the E2E tier 1 (HON-455). Migrations + seed run
    # against this DB before Playwright. Doesn't catch Neon-specific quirks
    # (pooling, cold starts) — preview-smoke covers those.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: honkadori_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/honkadori_test?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/honkadori_test?sslmode=disable
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET_CI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL_CI }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN_CI }}
      SEED_TEST_USERS: '1'
      SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
      SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      FORGOT_PASSWORD_TEST_EMAIL: ${{ secrets.FORGOT_PASSWORD_TEST_EMAIL }}
      FORGOT_PASSWORD_TEST_PASSWORD: ${{ secrets.FORGOT_PASSWORD_TEST_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run type check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test

      # Seed-data gate (HON-551): static validation of the seed TS arrays —
      # cross-file duplicates, naming conventions, nutritional plausibility,
      # and et translation coverage. No DB needed, so it runs in the cheap
      # static-check block and fails fast before the Playwright install.
      - name: Validate seed data
        run: pnpm db:validate

      # Guardrail (HON-560): @smoke specs run against shared staging, where
      # /api/e2e-seed 404s by design — fail at PR time if one reaches for a
      # seed-dependent helper. Static grep, no DB or browser needed.
      - name: Check @smoke specs are staging-safe
        run: bash scripts/check-smoke-specs.sh

      # Cache the ~150 MB Chromium download across runs. Playwright is pinned
      # in pnpm-lock.yaml, so the lockfile hash is a stable cache key (HON-529).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # On cache hit the browser binary is restored, but `--with-deps`
      # OS-level libraries are not in ~/.cache/ms-playwright. Install just
      # the deps (~5s) so headless launch doesn't fail with missing libs.
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Storybook a11y tests
        run: pnpm test-storybook:ci

      # ==========================================
      # E2E tier 1: Playwright against Docker Postgres sidecar (HON-455)
      # ==========================================
      - name: Apply database migrations
        run: pnpm prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      # Tier 1 E2E run. Step-level timeout sits below the job-level 45m so
      # Playwright gets killed before the whole job, letting the artifact
      # upload below still run with the partial test-results/ directory.
      #
      # E2E_DISABLE_RATE_LIMIT is scoped to this step only — setting it at
      # the job level would leak into `pnpm test` and short-circuit the
      # rate-limit unit tests (which assume the real limiter path). The
      # bypass is only meaningful during the live Playwright run against
      # the built Next app.
      - name: Run E2E tests (excluding @ai)
        timeout-minutes: 35
        env:
          E2E_DISABLE_RATE_LIMIT: '1'
        run: pnpm test:e2e --grep-invert=@ai

      - name: Upload Playwright artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-debug
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================
  # Vercel env-var drift audit (HON-550)
  # ==========================================
  # Surfaces vars configured in Vercel that no code references any more —
  # the dead-config half of retiring a FEATURE_* gate, which has no other
  # review trigger. Independent of the `ci` job: read-only, needs no DB or
  # browser, and must never be the reason a PR is blocked.
  #
  # Warn-only for now. The script exits 0 unless `--strict` is passed, and
  # `continue-on-error` additionally absorbs Vercel API hiccups. Promote to
  # blocking by adding `--strict` and dropping `continue-on-error` once the
  # report has stayed trustworthy for a few cycles.
  env-audit:
    name: Vercel env-var drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    # Forked PRs get no secrets, so the audit would fail on an empty token.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `.vercel/` is gitignored and absent in CI, so project identity comes
      # from secrets only — never from a checked-in project file.
      - name: Audit Vercel environment variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        # VERCEL_ORG_ID is gated alongside the other two: this project is
        # team-scoped, so without teamId the REST call 403s and the script
        # exits 1 — which continue-on-error would render as a green check with
        # no audit having run at all.
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "::warning::Skipping env-var drift audit — VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_ORG_ID not configured. See docs/ENVIRONMENT_SETUP.md."
            exit 0
          fi
          # Same reason: a crash on an always-green job is otherwise silent.
          pnpm env:audit || echo "::warning title=env-audit failed::The Vercel env-var drift audit did not complete — see this job's log."
